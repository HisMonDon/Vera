name: Deploy Flutter Web

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get
        working-directory: ./coolapp

      - name: Build Flutter web app
        run: |
          flutter build web --release \
            --base-href / \
            --csp \
            --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
        working-directory: ./coolapp

      - name: Relax CSP
        run: |
          sed -i "s|script-src 'self' blob: 'wasm-unsafe-eval'|script-src 'self' blob: 'wasm-unsafe-eval' static.cloudflareinsights.com www.gstatic.com|g" ./coolapp/build/web/index.html

      - name: Add .nojekyll file
        run: touch ./coolapp/build/web/.nojekyll
      
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./coolapp/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4